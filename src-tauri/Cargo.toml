[package]
name = "one-desktop"
version = "0.0.1"
description = "ONE native shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
