<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>本地笔记</title>
    <style>
      :root {
        color-scheme: light dark;
        --line: color-mix(in srgb, currentColor 18%, transparent);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px 16px 20px;
        font:
          14px/1.6 system-ui,
          'Microsoft YaHei',
          sans-serif;
        color: CanvasText;
        background: Canvas;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 2px;
      }
      .hint {
        margin: 0 0 12px;
        opacity: 0.7;
        font-size: 12px;
      }
      #add {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
      }
      input,
      textarea,
      button {
        font: inherit;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
      }
      textarea {
        resize: vertical;
        min-height: 64px;
      }
      button {
        cursor: pointer;
        justify-self: start;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      li:last-child {
        border-bottom: 0;
      }
      .what {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .when {
        font-size: 12px;
        opacity: 0.7;
        white-space: nowrap;
      }
      button.ghost {
        border-color: transparent;
        opacity: 0.65;
        padding: 2px 6px;
      }
      /* 编辑区占满整行：不跟标题挤在一行里，正文一长就排不开。 */
      .editor {
        flex: 1 0 100%;
        display: grid;
        gap: 6px;
        padding: 4px 0 10px;
      }
      .editor textarea {
        min-height: 110px;
      }
      .editor .row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .editor .spacer {
        flex: 1;
      }
      .banner {
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 12px;
        display: grid;
        gap: 6px;
      }
      .banner[data-kind='conflict'] {
        border-color: #b3261e;
      }
      .status {
        min-height: 20px;
        font-size: 12px;
        opacity: 0.8;
      }
      .status[data-kind='error'] {
        color: #b3261e;
        opacity: 1;
      }
      .empty {
        opacity: 0.7;
        padding: 10px 0;
      }
    </style>
  </head>
  <body>
    <h1>本地笔记</h1>
    <p class="hint">
      这个页面由笔记插件自己提供，运行在没有网络与文件权限的沙箱里。
    </p>

    <!--
      这里刻意**不是** `<form>`：沙箱 iframe 只给了 `allow-scripts`，没给 `allow-forms`，
      浏览器会在触发 `submit` 事件之前就把提交挡掉，按钮点了没反应也不报错（ADR-018）。
      提交走显式按钮，校验自己写 —— `required` 只在表单里才起作用。
    -->
    <div id="add">
      <input id="title" placeholder="新笔记标题" autocomplete="off" />
      <textarea id="body" placeholder="正文（可留空）"></textarea>
      <button type="button" id="create">记下来</button>
    </div>

    <p class="status" id="status" role="status"></p>
    <div id="list"><p class="empty">正在读取…</p></div>

    <script>
      // 协议与沙箱约定见 packages/contracts/src/page.ts。
      // 页面没有身份：宿主按窗口绑定的提供方转发，页面报什么都不作数（ADR-018）。
      var PROTOCOL = 'one.plugin.v1';
      var seq = 0;

      function ask(capability, args) {
        seq += 1;
        var id = 'page-' + seq;
        return new Promise(function (resolve, reject) {
          var timer = setTimeout(function () {
            reject(new Error('本体没有回应'));
          }, 8000);
          function onMessage(event) {
            var data = event.data;
            if (!data || data.protocol !== PROTOCOL || data.id !== id) return;
            clearTimeout(timer);
            window.removeEventListener('message', onMessage);
            if (data.ok) resolve(data.value);
            else {
              // **错误码要带上。** 少了它，「这条被别人改过了」与「日历源没连上」
              // 长得一模一样，而这两件事要给的界面完全不同。
              var failure = new Error(data.message || '操作失败');
              failure.code = data.code;
              failure.currentVersion = data.currentVersion;
              reject(failure);
            }
          }
          window.addEventListener('message', onMessage);
          window.parent.postMessage(
            { protocol: PROTOCOL, id: id, capability: capability, args: args },
            '*',
          );
        });
      }

      var el = function (id) {
        return document.getElementById(id);
      };

      function say(text, kind) {
        var node = el('status');
        node.textContent = text;
        node.setAttribute('data-kind', kind || 'info');
      }

      /**
       * 把同步抛出的异常变成一句话给用户看：处理器里抛了，界面上只会安静，
       * 用户看到的跟「程序坏了」分不开。
       */
      function guard(run) {
        try {
          return run();
        } catch (error) {
          say((error && error.message) || String(error), 'error');
        }
      }

      window.addEventListener('error', function (event) {
        say('页面出错：' + ((event && event.message) || '未知错误'), 'error');
      });

      /**
       * 正在编辑的那一条。
       *
       * `version` 是**打开编辑器时**看到的版本 —— 保存时按它走 `expectedVersion`，
       * 于是「我读到的和你看到的不一样」这件事由提供方去判，而不是页面自己比。
       * 页面不判版本：它只是替用户拿着那份草稿，并在他撞上冲突时**把草稿留住**。
       */
      var editing = null;

      /** 刚取回来的那一条全文。渲染完就清掉，不留着一份过期的。 */
      var pendingBody = null;

      function when(iso) {
        var date = new Date(iso);
        if (isNaN(date.getTime())) return '';
        return date.toLocaleDateString('zh-CN', {
          year: 'numeric',
          month: 'numeric',
          day: 'numeric',
        });
      }

      function button(text, onClick) {
        var node = document.createElement('button');
        node.className = 'ghost';
        node.type = 'button';
        node.textContent = text;
        node.addEventListener('click', function () {
          guard(onClick);
        });
        return node;
      }

      function input(placeholder, value) {
        var node = document.createElement('input');
        node.type = 'text';
        node.placeholder = placeholder;
        node.autocomplete = 'off';
        node.value = value;
        return node;
      }

      function textarea(value) {
        var node = document.createElement('textarea');
        node.placeholder = '正文（可留空）';
        node.value = value;
        return node;
      }

      /**
       * 编辑区。**冲突时不碰输入框。**
       *
       * 用户打了一段字，保存时发现别人先改了 —— 这时候清空输入框等于替他把刚打的
       * 字扔了，而且他不会知道为什么。所以草稿一直留在框里，只在**旁边**说清楚
       * 发生了什么，并给两个动作：重新载入（用服务器上的，丢草稿）/ 用我改的覆盖。
       */
      function editorFor(summary, note) {
        var box = document.createElement('div');
        box.className = 'editor';
        var titleField = input('标题', note.title);
        var bodyField = textarea(note.body);
        var banner = document.createElement('div');
        banner.className = 'banner';
        banner.hidden = true;

        var save = button('保存', function () {
          save.disabled = true;
          ask('notes.update', {
            id: note.id,
            expectedVersion: note.version,
            patch: { title: titleField.value, body: bodyField.value },
            idempotencyKey: crypto.randomUUID(),
          })
            .then(function () {
              editing = null;
              say('已保存。');
              return refresh();
            })
            .catch(function (error) {
              save.disabled = false;
              banner.hidden = false;
              banner.textContent = '';
              if (error.code === 'CONFLICT') {
                banner.setAttribute('data-kind', 'conflict');
                // 草稿一个字不动。只给两条路，并且把后果写清楚。
                banner.appendChild(
                  document.createTextNode(
                    '这条笔记在你编辑期间被改过了（它现在是第 ' +
                      (error.currentVersion || '?') +
                      ' 版，你手上是第 ' +
                      note.version +
                      ' 版）。你打的字都还在下面。',
                  ),
                );
                var reload = button('放弃我的，重新载入', function () {
                  editing = null;
                  refresh();
                });
                var overwrite = button('用我改的覆盖', function () {
                  // 覆盖要先认下**服务器当前版本**，否则只是再撞一次同样的冲突。
                  ask('notes.get', { id: note.id })
                    .then(function (fresh) {
                      note = fresh;
                      return ask('notes.update', {
                        id: fresh.id,
                        expectedVersion: fresh.version,
                        patch: {
                          title: titleField.value,
                          body: bodyField.value,
                        },
                        idempotencyKey: crypto.randomUUID(),
                      });
                    })
                    .then(function () {
                      editing = null;
                      say('已用你的版本覆盖。');
                      return refresh();
                    })
                    .catch(function (again) {
                      banner.setAttribute('data-kind', 'conflict');
                      banner.textContent =
                        '覆盖没有成功：' + again.message + '（你打的字还在）';
                      save.disabled = false;
                    });
                });
                var actions = document.createElement('div');
                actions.className = 'row';
                actions.appendChild(reload);
                actions.appendChild(overwrite);
                banner.appendChild(actions);
              } else {
                banner.setAttribute('data-kind', 'error');
                banner.textContent = error.message;
              }
            });
        });

        var row = document.createElement('div');
        row.className = 'row';
        var cancel = button('算了', function () {
          editing = null;
          refresh();
        });
        row.appendChild(save);
        row.appendChild(cancel);

        box.appendChild(titleField);
        box.appendChild(bodyField);
        box.appendChild(banner);
        box.appendChild(row);
        return box;
      }

      function render(items) {
        var host = el('list');
        host.textContent = '';
        if (!items.length) {
          var empty = document.createElement('p');
          empty.className = 'empty';
          empty.textContent = '还没有笔记。';
          host.appendChild(empty);
          return;
        }
        var list = document.createElement('ul');
        items.forEach(function (item) {
          var row = document.createElement('li');
          var what = document.createElement('span');
          what.className = 'what';
          what.textContent = item.title;
          var whenNode = document.createElement('span');
          whenNode.className = 'when';
          whenNode.textContent = when(item.updatedAt);

          var edit = button('编辑', function () {
            edit.disabled = true;
            // **编辑之前先读全文。** 列表只给摘要，正文不在里面 ——
            // 改不了读不到的东西。没有这一步，「编辑」就只能改标题。
            ask('notes.get', { id: item.id })
              .then(function (note) {
                editing = item.id;
                return refresh();
              })
              .catch(function (error) {
                edit.disabled = false;
                say(error.message, 'error');
              });
          });
          var drop = button('删除', function () {
            drop.disabled = true;
            ask('notes.remove', {
              id: item.id,
              expectedVersion: item.version,
              idempotencyKey: crypto.randomUUID(),
            })
              .then(function () {
                say('已删除。');
                return refresh();
              })
              .catch(function (error) {
                say(error.message, 'error');
                drop.disabled = false;
              });
          });

          row.appendChild(what);
          row.appendChild(whenNode);
          row.appendChild(edit);
          row.appendChild(drop);
          // 正文只在打开编辑时才取，列表不预取。
          if (editing === item.id && pendingBody) {
            row.appendChild(editorFor(item, pendingBody));
            pendingBody = null;
          }
          list.appendChild(row);
        });
        host.appendChild(list);
      }

      function refresh() {
        // 正在编辑的那条要先取回正文 —— 列表只给摘要，没有正文就没法编辑。
        var loadBody = editing
          ? ask('notes.get', { id: editing })
          : Promise.resolve(null);
        return loadBody
          .then(function (note) {
            pendingBody = note;
            return ask('notes.list', { limit: 50 });
          })
          .then(function (page) {
            render(page.items || []);
          })
          .catch(function (error) {
            el('list').textContent = '';
            say(error.message, 'error');
          });
      }

      /** 新建笔记。没有表单，校验自己写（见上面那段注释）。 */
      function createNote() {
        var title = el('title').value.trim();
        if (!title) {
          say('先给笔记起个标题。', 'error');
          return;
        }
        var send = el('create');
        send.disabled = true;
        ask('notes.create', {
          title: title,
          body: el('body').value,
          idempotencyKey: crypto.randomUUID(),
        })
          .then(function () {
            el('title').value = '';
            el('body').value = '';
            say('已记下来。');
            return refresh();
          })
          .catch(function (error) {
            say(error.message, 'error');
          })
          .then(function () {
            send.disabled = false;
          });
      }

      el('create').addEventListener('click', function () {
        guard(createNote);
      });

      // 标题上回车直接提交；正文里回车要换行，所以用 Ctrl+Enter。
      // 两处都要看 `isComposing`：输入法里回车先用来上屏（P06 要试的手感）。
      el('title').addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && !event.isComposing) {
          event.preventDefault();
          guard(createNote);
        }
      });
      el('body').addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && event.ctrlKey && !event.isComposing) {
          event.preventDefault();
          guard(createNote);
        }
      });

      refresh();
    </script>
  </body>
</html>
